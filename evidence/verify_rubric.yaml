rubrics:
  - id: 1
    type: f2p
    text: "移除前解析所有有效 environment 视图，并列出 job、schedule 和插件继承中的真实引用。"
  - id: 2
    type: f2p
    text: "存在任何阻断引用时命令不修改项目定义、lock、虚拟环境或生成文件。"
  - id: 3
    type: f2p
    text: "可移除时项目定义、lock 和相关缓存以版本校验的一次提交更新，不留下相互矛盾视图。"
  - id: 4
    type: f2p
    text: "共享文件或仍被其他插件引用的制品不会删除，插件专属资源才进入清理。"
  - id: 5
    type: f2p
    text: "配置提交后的虚拟环境或文件清理失败会返回部分完成状态，并可用同一操作继续。"
  - id: 6
    type: f2p
    text: "进程在提交或清理阶段崩溃后，可从持久日志完成剩余清理而不重新删除配置。"
  - id: 7
    type: f2p
    text: "确认期间配置变化会阻止陈旧计划提交并要求重新校验引用。"
  - id: 8
    type: p2p
    text: "不存在插件维持既有幂等结果，dry-run 只报告完整计划且不写项目或磁盘。"
