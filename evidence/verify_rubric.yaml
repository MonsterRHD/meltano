rubrics:
  - id: 1
    type: f2p
    text: "安装开始时冻结带身份的插件、版本、配置和 lock 输入，后续步骤均引用同一计划。"
  - id: 2
    type: f2p
    text: "依赖只安装到隔离暂存环境，完成可执行性检查前不会替换当前可运行环境。"
  - id: 3
    type: f2p
    text: "安装或验证失败保留上一个环境和对应 lock/manifest 视图，并记录可判定的失败/恢复状态。"
  - id: 4
    type: f2p
    text: "成功提交以原子切换公开新环境和对应 lock/manifest，观察者看不到混合版本。"
  - id: 5
    type: f2p
    text: "进程重启能识别同计划暂存物并继续或安全清理，原子切换中断不会留下半发布状态。"
  - id: 6
    type: f2p
    text: "等待期间项目配置改变会拒绝提交旧计划，不覆盖较新的 lock 或 manifest。"
  - id: 7
    type: f2p
    text: "同一插件并发安装只有一个提交者，不同插件可并行；dry-run 完全不写磁盘。"
  - id: 8
    type: p2p
    text: "无变更环境保持快速路径，离线模式不下载未锁定制品且失败时不破坏现有安装。"
