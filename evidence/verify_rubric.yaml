rubrics:
  - id: 1
    type: f2p
    text: "批次开始时冻结 environment 有效配置、目标插件集合和各定义来源，并生成稳定快照版本。"
  - id: 2
    type: f2p
    text: "每个插件解析结果记录与输入来源身份，不能把 Hub、本地或缓存的不同修订误合并。"
  - id: 3
    type: f2p
    text: "发布后读取方只能看到完整旧快照或完整新快照，不会看到部分插件已更新。"
  - id: 4
    type: f2p
    text: "任一插件解析失败时旧快照保持可用，并返回完整逐项目结果。"
  - id: 5
    type: f2p
    text: "重试可复用输入身份未变的成功解析；输入变化的项目必须重新解析。"
  - id: 6
    type: f2p
    text: "并发批次通过项目版本检测冲突，发布中断后重启可完成同一快照或清理暂存。"
  - id: 7
    type: p2p
    text: "现有单插件 lock、只读检查和没有锁文件的兼容项目保持原行为。"
  - id: 8
    type: f2p
    text: "离线模式只使用来源身份匹配且本地可用的定义，缺失时不发布混合快照。"
